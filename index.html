<style>
/* Airmail: questions arrive in a lively parents' group chat; the result is an airmail offer letter with your persona as a postage stamp.
   One loud moment: the offer stamp slamming onto the letter. Everything else stays calm and left-aligned. */
:root{
  color-scheme: light;
  --white:#FFFFFF;
  --sky:#E8EFF8;      /* chat + desk */
  --ink:#14213D;      /* outlines, text */
  --red:#D7263D;      /* airmail red, rubber stamps */
  --blue:#1F4FB4;     /* airmail blue, parent's own voice */
  --butter:#FFD84D;   /* highlights, red packets */
  --mute:#5D6B85;
  --line:#CBD5E3;
  --f-dis:"ZCOOL QingKe HuangYou","PingFang SC","Microsoft YaHei",sans-serif;
  --f-txt:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
  --f-sig:"Ma Shan Zheng","STKaiti","KaiTi",cursive;
  --airmail:repeating-linear-gradient(-45deg,var(--red) 0 12px,var(--white) 12px 18px,var(--blue) 18px 30px,var(--white) 30px 36px);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-txt);font-size:16px;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--butter);outline-offset:2px}
.app{max-width:480px;margin:0 auto;min-height:100%;position:relative;background:var(--sky)}
.screen{display:none}
.screen.on{display:block}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stripe{height:10px;background:var(--airmail)}
.btn{display:block;width:100%;border:2.5px solid var(--ink);border-radius:12px;padding:14px 16px;font-size:18px;font-weight:700;background:var(--white);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn-blue{background:var(--blue);color:#fff}
.btn-butter{background:var(--butter)}
.link{background:none;border:0;padding:6px 0;font-size:15px;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px;text-decoration-color:var(--red)}

/* ---------- HOME ---------- */
#home{min-height:100vh;background:var(--white)}
.home-in{padding-block:22px 28px;display:flex;flex-direction:column;gap:18px}
.fan{position:relative;height:230px;margin-top:6px}
.fan svg{position:absolute;width:132px;filter:drop-shadow(0 6px 10px rgba(20,33,61,.18))}
.fan .s1{left:2%;top:34px;transform:rotate(-11deg)}
.fan .s2{left:calc(50% - 66px);top:6px;transform:rotate(3deg);z-index:2}
.fan .s3{right:2%;top:40px;transform:rotate(12deg)}
.postmark{position:absolute;width:118px;height:118px;border:3px solid var(--ink);border-radius:50%;opacity:.55;z-index:3;display:grid;place-items:center;text-align:center;font-family:var(--f-dis);font-size:15px;line-height:1.2;color:var(--ink)}
.postmark::before,.postmark::after{content:"";position:absolute;left:-60%;right:-60%;height:3px;background:repeating-linear-gradient(90deg,var(--ink) 0 18px,transparent 18px 26px)}
.postmark::before{top:38%}.postmark::after{top:58%}
.fan .postmark{left:30%;top:148px;width:96px;height:96px;font-size:13px;transform:rotate(-8deg)}
.h1{font-family:var(--f-dis);font-weight:400;font-size:clamp(46px,14vw,64px);line-height:1.02;margin:0;letter-spacing:.01em}
.h1 em{font-style:normal;background:linear-gradient(transparent 62%,var(--butter) 62% 92%,transparent 92%)}
.lede{margin:0;font-size:17px;line-height:1.7;color:var(--ink);max-width:28em}
.small{font-size:14px;color:var(--mute);margin:0}
.home-row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.fine{font-size:12px;color:var(--mute);line-height:1.7;margin:6px 0 0;border-top:1px dashed var(--line);padding-top:14px}

/* ---------- CHAT ---------- */
#chat.on{display:flex;flex-direction:column;min-height:100vh}
.chat-head{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--white)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--white)}
.bar{display:flex;align-items:center;gap:8px;min-height:50px}
.bar .t{flex:1;min-width:0;text-align:center;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar button{background:none;border:0;padding:6px 4px;font-size:14px}
.bar .cnt{font-family:var(--f-dis);font-size:18px;font-variant-numeric:tabular-nums;min-width:52px;text-align:right}
.prog{height:6px;background:var(--airmail);opacity:.18;position:relative}
.progwrap{position:relative;height:6px}
.progwrap i{position:absolute;inset:0 auto 0 0;width:0;background:var(--airmail);transition:width .5s}
.msgs{flex:1;padding-block:16px 18px;display:flex;flex-direction:column;gap:14px}
.sys{align-self:center;font-size:12px;color:var(--mute);background:rgba(20,33,61,.06);border-radius:6px;padding:4px 10px;text-align:center;max-width:88%}
.row{display:flex;gap:9px;align-items:flex-start}
.row.me{flex-direction:row-reverse}
.av{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;border:2.5px solid var(--ink)}
.av.host{background:var(--red);font-family:var(--f-dis);font-weight:400;font-size:19px}
.av.me{background:var(--blue)}
.col{min-width:0;max-width:calc(100% - 98px);display:flex;flex-direction:column;gap:4px}
.row.me .col{align-items:flex-end}
.who{font-size:12px;color:var(--mute)}
.bub{background:var(--white);border:2px solid var(--ink);border-radius:4px 16px 16px 16px;padding:10px 13px;line-height:1.6;word-break:break-word}
.row.me .bub{background:var(--blue);color:#fff;border-radius:16px 4px 16px 16px}
.bub.q{font-size:17px;font-weight:700}
.bub.q.fu{background:var(--butter)}
.bub.small{font-size:15px;padding:7px 11px;border-width:1.5px}
.sticker{width:96px;background:var(--white);border:2px solid var(--ink);border-radius:14px;padding:6px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;transform:rotate(-3deg)}
.sticker svg{width:78px}
.sticker b{font-family:var(--f-dis);font-weight:400;font-size:20px;line-height:1}
.typing{display:inline-flex;gap:5px;padding:14px 16px}
.typing i{width:7px;height:7px;border-radius:50%;background:var(--mute);animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,100%{opacity:.25}50%{opacity:1}}
.packet{width:220px;max-width:100%;border:2px solid var(--ink);border-radius:12px;background:var(--red);color:#fff;padding:14px;text-align:left;display:flex;gap:12px;align-items:center}
.packet .coin{flex:none;width:38px;height:38px;border-radius:50%;background:var(--butter);color:var(--red);display:grid;place-items:center;font-family:var(--f-dis);font-size:22px;border:2px solid var(--ink)}
.packet.opened{background:#E8A3AC}
.mailcard{width:230px;max-width:100%;border:2px solid var(--ink);border-radius:12px;padding:10px;background:var(--white);text-align:left;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden}
.mailcard::before{content:"";position:absolute;inset:0;border:7px solid transparent;border-image:var(--airmail) 12;pointer-events:none}
.mailcard .mt{font-family:var(--f-dis);font-size:22px;padding:6px 8px 0}
.mailcard .mb{font-size:13px;color:var(--mute);padding:0 8px 6px}
.new{animation:pop .32s cubic-bezier(.2,1.4,.4,1) both}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.reply{position:sticky;bottom:0;background:var(--white);border-top:2.5px solid var(--ink);padding-block:10px calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:8px}
.rl{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--mute)}
.undo{background:none;border:0;font-size:13px;color:var(--mute);text-decoration:underline;padding:2px 0}
.undo[disabled]{opacity:.35;text-decoration:none;cursor:default}
.opt{background:var(--white);border:2px solid var(--ink);border-radius:12px;padding:11px 13px;text-align:left;font-size:15.5px;line-height:1.5;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s,background .1s}
.opt:hover{background:#F3F7FF}
.opt:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.reply.wait .opt{opacity:.45;pointer-events:none}

/* ---------- REVEAL ---------- */
#reveal{min-height:100vh;background:var(--blue);color:#fff}
#reveal.on{display:flex;flex-direction:column;justify-content:center;gap:16px;padding-block:40px}
.rv-line{font-family:var(--f-dis);font-size:26px;line-height:1.3;opacity:.35}
.rv-line.on{opacity:1}
.rv-line.on::before{content:"✓ ";color:var(--butter)}
.rv-big{font-family:var(--f-dis);font-size:44px;color:var(--butter);min-height:1.2em}

/* ---------- ENVELOPE ---------- */
#mail{min-height:100vh;background:var(--sky)}
#mail.on{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:22px;padding-block:30px}
.env{position:relative;width:min(340px,100%);aspect-ratio:3/2;background:var(--white);border:2.5px solid var(--ink);border-radius:6px;padding:0;box-shadow:0 18px 30px -18px rgba(20,33,61,.5);overflow:hidden;transform:rotate(-2deg)}
.env::before{content:"";position:absolute;inset:0;border:12px solid transparent;border-image:var(--airmail) 14}
.env .es{position:absolute;right:22px;top:22px;width:62px;transform:rotate(5deg)}
.env .epm{position:absolute;right:58px;top:44px;width:84px;height:84px;font-size:12px}
.env .to{position:absolute;left:34px;bottom:34px;text-align:left;font-family:var(--f-sig);font-size:30px;line-height:1.25}
.env .to small{display:block;font-family:var(--f-txt);font-size:12px;color:var(--mute)}
.env .par{position:absolute;left:34px;top:30px;font-family:var(--f-dis);font-size:18px;color:var(--red);border:2px solid var(--red);padding:2px 8px;transform:rotate(-4deg)}
.env.shake{animation:shake .5s}
@keyframes shake{20%{transform:rotate(2deg) scale(1.03)}40%{transform:rotate(-5deg)}60%{transform:rotate(3deg)}80%{transform:rotate(-3deg)}}
.mail-tip{font-size:14px;color:var(--mute);margin:0}

/* ---------- LETTER ---------- */
#letter{padding-block:16px 32px}
.paper{background:var(--white);position:relative;padding:18px;border:2.5px solid var(--ink)}
.paper::before{content:"";position:absolute;inset:0;border:10px solid transparent;border-image:var(--airmail) 12;pointer-events:none}
.pin{padding:12px 6px 4px}
.lh{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;border-bottom:2.5px solid var(--ink);padding-bottom:12px}
.lh .u{font-family:var(--f-dis);font-size:22px;line-height:1.15}
.lh .u small{display:block;font-family:var(--f-txt);font-size:12px;color:var(--mute);margin-top:4px}
.lh .d{font-size:12px;color:var(--mute);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.hero{display:grid;grid-template-columns:42% 1fr;gap:16px;align-items:start;padding:20px 0 16px;position:relative}
.hero .bigstamp{width:100%;transform:rotate(-4deg);filter:drop-shadow(0 6px 8px rgba(20,33,61,.2))}

.hero .admit{min-width:0;display:flex;flex-direction:column;gap:6px}
.hero .admit p{margin:0;font-size:14px;color:var(--mute)}
.hero .code{font-family:var(--f-dis);font-size:clamp(40px,12vw,56px);line-height:.95;color:var(--blue);word-break:break-all}
.hero .pname{font-family:var(--f-dis);font-size:clamp(22px,6.6vw,32px);line-height:1.15}
.rubber{align-self:flex-start;margin-top:10px;z-index:4;white-space:nowrap;border:3.5px solid var(--red);color:var(--red);border-radius:8px;padding:6px 12px;font-family:var(--f-dis);font-size:24px;line-height:1.05;text-align:center;transform:rotate(-14deg);background:rgba(255,255,255,.7);mix-blend-mode:multiply}
.rubber small{display:block;font-family:var(--f-txt);font-weight:700;font-size:12px;letter-spacing:.06em}
.rubber.slam{animation:slam .55s cubic-bezier(.3,1.6,.5,1) .5s both}
@keyframes slam{0%{opacity:0;transform:rotate(-14deg) scale(3)}60%{opacity:1;transform:rotate(-14deg) scale(.92)}100%{opacity:1;transform:rotate(-14deg) scale(1)}}
.paper.thud{animation:thud .3s .82s}
@keyframes thud{50%{transform:translateY(3px)}}
.line{font-size:18px;line-height:1.75;margin:0 0 16px;font-weight:500}
.facts{display:grid;grid-template-columns:auto 1fr;gap:9px 14px;margin:0 0 16px;padding:14px 0;border-top:1.5px dashed var(--line);border-bottom:1.5px dashed var(--line);font-size:15px;line-height:1.6}
.facts dt{color:var(--mute);font-size:13px;padding-top:2px;white-space:nowrap}
.facts dd{margin:0;min-width:0}
.bars{display:flex;flex-direction:column;gap:9px;margin-bottom:16px}
.bar2{display:grid;grid-template-columns:62px 1fr 34px;gap:10px;align-items:center;font-size:13px;font-variant-numeric:tabular-nums}
.bar2 .tr{height:14px;border:2px solid var(--ink);border-radius:8px;overflow:hidden;background:var(--white)}
.bar2 .tr i{display:block;height:100%;background:var(--red);transform-origin:left;animation:grow 1.1s .9s both}
.bar2.c .tr i{background:var(--butter)}
@keyframes grow{from{transform:scaleX(0)}}
.partner{display:flex;gap:12px;align-items:center;background:var(--sky);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.partner svg{flex:none;width:52px}
.partner div{min-width:0;font-size:14px;line-height:1.6}
.partner b{font-size:15px}
.clause{border-left:4px solid var(--red);padding:6px 12px;margin-bottom:14px;font-size:15px;line-height:1.7}
.press{font-family:Georgia,serif;font-style:italic;font-size:16px;color:var(--mute);margin:0 0 14px;line-height:1.45}
.ps{font-size:15px;line-height:1.7;margin:0 0 16px}
.ps b{font-family:var(--f-dis);font-weight:400;font-size:19px;color:var(--blue);margin-right:4px}
.note{border-top:2.5px solid var(--ink);padding-top:14px}
.note .lbl{font-size:13px;color:var(--red);font-weight:700;margin-bottom:6px}
.note .cmt{font-size:17px;line-height:1.8;margin:0}
.sign{display:flex;justify-content:flex-end;align-items:baseline;gap:8px}
.sign .sg{font-family:var(--f-sig);font-size:44px;line-height:1.1;transform:rotate(-5deg)}
.sign small{font-size:12px;color:var(--mute)}
.disc{font-size:11px;color:var(--mute);text-align:center;margin:16px 0 0;line-height:1.6}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:20px}
.acts .wide{grid-column:1/-1}
.acts .btn{font-size:16px;padding:12px 10px}
.contact{margin-top:22px;background:var(--ink);color:#fff;border-radius:14px;padding:18px;display:grid;grid-template-columns:1fr auto;gap:14px;align-items:center}
.contact h3{margin:0 0 6px;font-family:var(--f-dis);font-weight:400;font-size:24px}
.contact p{margin:0;font-size:13px;color:#C9D3E6;line-height:1.7}
.wx{margin-top:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:14px}
.wx code{font-family:var(--f-txt);background:rgba(255,255,255,.12);padding:3px 8px;border-radius:4px;user-select:all}
.copy{background:var(--butter);color:var(--ink);border:0;border-radius:6px;padding:4px 10px;font-size:13px;font-weight:700}
.qr{width:96px;height:96px;background:#fff;border-radius:8px;display:grid;place-items:center;text-align:center;font-size:11px;color:var(--mute);line-height:1.5;overflow:hidden}
.qr img{width:100%;height:100%;object-fit:cover}
@media (max-width:360px){.contact{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.hero .bigstamp{width:60%}}

/* ---------- ALBUM ---------- */
#album{min-height:100vh;background:var(--blue);color:#fff;padding-block:16px 32px}
.al-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:8px 0 4px}
.al-head h2{margin:0;font-family:var(--f-dis);font-weight:400;font-size:34px}
.al-head .n{font-family:var(--f-dis);font-size:28px;font-variant-numeric:tabular-nums}
.al-sub{margin:0 0 18px;font-size:14px;color:#D6E0F5;line-height:1.6}
#album .link{color:#fff;text-decoration-color:var(--butter)}
.al-sec{font-size:13px;color:#D6E0F5;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid svg{width:100%;display:block}
.grid .g{transform:rotate(var(--r,0deg))}
.secret{margin-top:22px;background:var(--white);color:var(--ink);border-radius:12px;padding:16px;font-size:15px;line-height:1.8}
.secret .lbl{font-size:13px;color:var(--red);font-weight:700;margin-bottom:4px}
.secret.lock{background:transparent;color:#D6E0F5;border:2px dashed rgba(255,255,255,.4);font-size:14px}

/* ---------- MODAL / TOAST ---------- */
.modal{position:fixed;inset:0;background:rgba(20,33,61,.9);z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding-block:calc(20px + env(safe-area-inset-top,0px)) calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal img{max-width:min(360px,100%);max-height:72vh;border-radius:6px}
.modal p{color:#fff;font-size:14px;margin:0;text-align:center}
.modal .btn{max-width:180px}
.toast{position:fixed;left:50%;bottom:calc(120px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:9px 14px;border-radius:8px;font-size:14px;z-index:30;opacity:0;transition:opacity .2s;pointer-events:none;max-width:86vw;text-align:center}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>


</head>

<section id="reveal" class="screen gut" aria-label="评审中">

<section id="mail" class="screen gut" aria-label="航空信">

  </button>

</section>

<section id="album" class="screen gut" aria-label="集邮册">

</div>
